<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72">
  <defs>
    <linearGradient id="dcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#0a1a3a" />
    </linearGradient>
    <linearGradient id="triangleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <filter id="dcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff7a00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Escudo / Base do Emblema Internacional de Proteção e Defesa Civil -->
  <g transform="translate(6, 6)">
    <!-- Base azul marinho com cantos arredondados -->
    <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#dcBg)" stroke="#1e40af" stroke-width="2"/>
    
    <!-- Triângulo equilátero laranja internacional (Convenção de Genebra / SEDEC) -->
    <polygon points="30,11 50,47 10,47" fill="url(#triangleGrad)" filter="url(#dcGlow)"/>

    <!-- Detalhes do triângulo -->
    <polygon points="30,15 46,45 14,45" fill="none" stroke="#ffa726" stroke-width="1.2" opacity="0.6"/>

    <!-- Pequeno detalhe representativo Brasil (Faixa Verde e Amarela discreta) -->
    <path d="M18,52 L42,52" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22,55 L38,55" stroke="#eab308" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Tipografia Oficial SEDEC / Defesa Civil Brasil -->
  <g transform="translate(76, 14)">
    <text x="0" y="18" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="1.2">DEFESA CIVIL</text>
    <text x="0" y="32" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#f97316" letter-spacing="2.5">SEDEC • BRASIL</text>
    <text x="0" y="44" font-family="'Courier New', monospace" font-weight="600" font-size="8.5" fill="#94a3b8" letter-spacing="0.5">SISTEMA NACIONAL DE PROTEÇÃO</text>
  </g>
</svg>
